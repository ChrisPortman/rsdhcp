[package]
name = "rsdhcp"
version = "0.1.0"
edition = "2024"

[lib]
name = "rsdhcp"
path = "src/lib.rs"

[[bin]]
name = "rsdhcp"
path = "src/cmd/rsdhcp.rs"

[dependencies]
rsdhcp_macros = { path = "../rsdhcp_macros" }
spmc = "0"
serde_yaml = "0"
serde = { version = "1", features = ["derive"] }
once_cell = "1"
ipnetwork = "0"
nix = { version = "0", features = ["net"] }
tokio = { version = "1", features = ["full"] }
log = "0"
env_logger = "0"
socket2 = "0"
reqwest = {version="0", features=["json", "query"]}
chrono-wasi07 = {version = "0", features=["serde"]}
async-trait = "0"
ipnet = { version = "2", features = ["serde"] }

[lints.clippy]
uninlined_format_args = "allow"
