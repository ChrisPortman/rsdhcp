name: rsDHCP Pipeline

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Rust project - latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@v4

      - name: Test and Build
        run: |
          rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
          cargo test --verbose
          cargo build --verbose --release

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: rsdhcp
          path: ./target/release/rsdhcp

  docker:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/rsdhcp:${{ github.ref_name }}

  release:
    needs: test-and-build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: rsdhcp
          path: ./rsdhcp-${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided automatically by GitHub Actions
        run: |
          gh release create ${{ github.ref_name }} ./rsdhcp-${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
